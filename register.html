<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — eebecco | Premium Uji Ceremonial Matcha</title>
  <meta name="description" content="Create your eebecco account. Access your purchase history, manage your mailing list subscription, and checkout faster.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--deep-ebony);
    }
    .auth-card {
      background: var(--card-bg-solid);
      border: 1px solid var(--gold-border);
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .auth-card .card-corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 0.4rem;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: rgba(245,236,215,0.5);
      margin-bottom: 2.25rem;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-family: var(--font-label);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--antique-gold);
      margin-bottom: 0.5rem;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--gold-border);
      padding: 0.85rem 1rem;
      color: var(--warm-cream);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s ease;
      border-radius: 2px;
    }
    .form-input:focus {
      border-color: var(--antique-gold);
    }
    .form-input::placeholder {
      color: rgba(245,236,215,0.25);
    }
    .form-error {
      color: #e74c3c;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
      font-family: var(--font-label);
    }
    .form-error.visible {
      display: block;
    }
    .form-success {
      background: rgba(109,168,94,0.12);
      border: 1px solid rgba(109,168,94,0.3);
      color: var(--matcha-bright);
      padding: 1rem;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 1.5rem;
      display: none;
      line-height: 1.6;
    }
    .form-success.visible {
      display: block;
    }
    .btn-full {
      width: 100%;
      justify-content: center;
      padding: 1rem;
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }
    .btn-loading {
      opacity: 0.65;
      pointer-events: none;
    }
    .auth-link {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.82rem;
      color: rgba(245,236,215,0.4);
    }
    .auth-link a {
      color: var(--antique-gold);
      transition: color 0.3s ease;
    }
    .auth-link a:hover {
      color: var(--muted-gold);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-label);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(245,236,215,0.35);
      margin-bottom: 2rem;
      transition: color 0.3s ease;
    }
    .back-link:hover {
      color: var(--antique-gold);
    }
    .password-strength {
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
      display: none;
    }
    .password-strength.weak { display: block; background: linear-gradient(to right, #e74c3c, transparent); }
    .password-strength.medium { display: block; background: linear-gradient(to right, #f39c12, transparent); }
    .password-strength.strong { display: block; background: linear-gradient(to right, var(--matcha-bright), transparent); }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <svg class="card-corners corner-tl" style="top:12px; left:12px; width:32px; height:32px;" viewBox="0 0 28 28" fill="none"><path d="M1 27 L1 5 Q1 1 5 1 L27 1" stroke="#C9933A" stroke-width="0.8" fill="none"/><circle cx="3.5" cy="3.5" r="1.2" fill="#C9933A" opacity="0.5"/></svg>
      <svg class="card-corners corner-tr" style="top:12px; right:12px; width:32px; height:32px; transform:scaleX(-1);" viewBox="0 0 28 28" fill="none"><path d="M1 27 L1 5 Q1 1 5 1 L27 1" stroke="#C9933A" stroke-width="0.8" fill="none"/><circle cx="3.5" cy="3.5" r="1.2" fill="#C9933A" opacity="0.5"/></svg>
      <svg class="card-corners corner-bl" style="bottom:12px; left:12px; width:32px; height:32px; transform:scaleY(-1);" viewBox="0 0 28 28" fill="none"><path d="M1 27 L1 5 Q1 1 5 1 L27 1" stroke="#C9933A" stroke-width="0.8" fill="none"/><circle cx="3.5" cy="3.5" r="1.2" fill="#C9933A" opacity="0.5"/></svg>
      <svg class="card-corners corner-br" style="bottom:12px; right:12px; width:32px; height:32px; transform:scale(-1);" viewBox="0 0 28 28" fill="none"><path d="M1 27 L1 5 Q1 1 5 1 L27 1" stroke="#C9933A" stroke-width="0.8" fill="none"/><circle cx="3.5" cy="3.5" r="1.2" fill="#C9933A" opacity="0.5"/></svg>

      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to home
      </a>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join eebecco to track orders, manage your preferences, and access exclusive content.</p>

      <div id="success-msg" class="form-success"></div>
      <div id="error-msg" class="form-error"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName" class="form-label">Full name</label>
          <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Your full name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
          <div id="password-strength" class="password-strength"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <p class="auth-link">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { register } from './js/auth.js';

    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const strengthEl = document.getElementById('password-strength');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      successMsg.classList.remove('visible');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.add('visible');
      errorMsg.classList.remove('visible');
    }

    function clearMessages() {
      errorMsg.classList.remove('visible');
      successMsg.classList.remove('visible');
    }

    function checkPasswordStrength(password) {
      if (password.length < 8) return 'weak';
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[^A-Za-z0-9]/.test(password);
      const score = [hasUpper, hasLower, hasNumber, hasSpecial].filter(Boolean).length;
      if (score >= 3 && password.length >= 12) return 'strong';
      if (score >= 2) return 'medium';
      return 'weak';
    }

    passwordInput.addEventListener('input', () => {
      const strength = checkPasswordStrength(passwordInput.value);
      strengthEl.className = 'password-strength ' + strength;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();

      const fullName = form.fullName.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      submitBtn.textContent = 'Creating account...';
      submitBtn.classList.add('btn-loading');

      try {
        const { data, error } = await register(email, password, fullName);

        if (error) {
          showError(error.message);
          submitBtn.textContent = 'Create Account';
          submitBtn.classList.remove('btn-loading');
          return;
        }

        successMsg.innerHTML = 'Account created!<br><br>If email confirmation is enabled, please check your inbox to confirm your email. Otherwise, you can sign in now.';
        successMsg.classList.add('visible');
        submitBtn.textContent = 'Account created ✓';
        submitBtn.classList.remove('btn-loading');
        form.reset();
        strengthEl.className = 'password-strength';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3500);

      } catch (err) {
        showError('Something went wrong. Please try again.');
        submitBtn.textContent = 'Create Account';
        submitBtn.classList.remove('btn-loading');
      }
    });
  </script>
</body>
</html>
