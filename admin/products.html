<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — eebecco Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">
      <a href="index.html" class="admin-sidebar-logo">
        <img src="../logo.jpg" alt="eebecco" onerror="this.style.display='none'">
        <div><span>eebecco</span><small>Admin Panel</small></div>
      </a>
    </div>
    <nav class="admin-nav">
      <div class="admin-nav-section">Main</div>
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <div class="admin-nav-section">Catalog</div>
      <a href="products.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Products
      </a>
      <a href="stock.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
        Stock
      </a>
      <div class="admin-nav-section">Content</div>
      <a href="pages.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Pages
      </a>
      <div class="admin-nav-section">Engagement</div>
      <a href="contacts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Contact Inquiries
      </a>

      <div class="admin-nav-section">Settings</div>
      <a href="admins.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Admin Users
      </a>
      <a href="#" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">A</div>
        <div>
          <div class="user-name" id="user-name">Admin</div>
          <div class="user-email" id="user-email">—</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h2>Products</h2>
        <div class="breadcrumb"><a href="index.html">Admin</a> / Products</div>
      </div>
      <a href="product-form.html" class="btn btn-primary btn-sm">+ Add Product</a>
    </div>

    <div style="display:flex; gap:0.75rem; margin-bottom:1.5rem;">
      <input type="text" id="search-input" placeholder="Search products..." style="flex:1; padding:0.6rem 1rem; background:var(--admin-sidebar); border:1px solid var(--admin-border); border-radius:8px; color:var(--admin-text); font-size:0.85rem; font-family:var(--font-main);">
      <select id="filter-grade" style="padding:0.6rem 1rem; background:var(--admin-sidebar); border:1px solid var(--admin-border); border-radius:8px; color:var(--admin-text); font-size:0.85rem; font-family:var(--font-main);">
        <option value="">All Grades</option>
        <option value="Ceremonial">Ceremonial</option>
        <option value="Barista">Barista</option>
        <option value="Premium">Premium</option>
      </select>
      <select id="filter-stock" style="padding:0.6rem 1rem; background:var(--admin-sidebar); border:1px solid var(--admin-border); border-radius:8px; color:var(--admin-text); font-size:0.85rem; font-family:var(--font-main);">
        <option value="">All Stock</option>
        <option value="in">In Stock</option>
        <option value="low">Low Stock</option>
        <option value="out">Out of Stock</option>
      </select>
    </div>

    <div class="admin-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Grade</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="products-tbody">
          <tr><td colspan="6" style="text-align:center; color:var(--admin-text-dim); padding:2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import supabase from '../js/supabase.js';

  if (!sessionStorage.getItem('admin_uid')) { window.location.href = 'admin-login.html'; }

  const email = sessionStorage.getItem('admin_email');
  document.getElementById('user-name').textContent = email ? email.split('@')[0] : 'Admin';
  document.getElementById('user-email').textContent = email || '—';
  document.getElementById('user-avatar').textContent = email ? email[0].toUpperCase() : 'A';

  document.getElementById('logout-btn').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    sessionStorage.clear();
    window.location.href = 'admin-login.html';
  });

  let allProducts = [];

  async function loadProducts() {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !data) return;
    allProducts = data;
    renderProducts(allProducts);
  }

  function renderProducts(products) {
    const tbody = document.getElementById('products-tbody');
    if (!products.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--admin-text-dim); padding:2rem;">No products found.</td></tr>';
      return;
    }
    tbody.innerHTML = products.map(p => {
      const stockClass = p.stock === 0 ? 'stock-out' : p.stock <= 10 ? 'stock-low' : 'stock-ok';
      const stockText = p.stock === 0 ? 'Out of stock' : `${p.stock} units`;
      const statusBadge = p.is_active
        ? '<span style="color:var(--admin-success); font-size:0.75rem;">● Active</span>'
        : '<span style="color:var(--admin-text-dim); font-size:0.75rem;">● Inactive</span>';
      return `<tr>
        <td>
          <div class="product-cell">
            ${p.image_url ? `<img src="${p.image_url}" class="product-thumb" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2244%22><rect fill=%22%232a3020%22 width=%2244%22 height=%2244%22 rx=%228%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2220%22>🍵</text></svg>'">` : '<div class="product-thumb-placeholder">🍵</div>'}
            <div>
              <div style="font-weight:500;">${p.name}</div>
              ${p.badge ? `<span class="badge-tag">${p.badge}</span>` : ''}
            </div>
          </div>
        </td>
        <td style="color:var(--admin-text-dim);">${p.grade_label || p.grade}</td>
        <td class="price-cell">S$${p.price.toFixed(2)}</td>
        <td><span class="stock-badge ${stockClass}">${stockText}</span></td>
        <td>${statusBadge}</td>
        <td>
          <div class="action-btns">
            <a href="product-form.html?id=${p.id}">Edit</a>
            <button class="btn-delete" data-id="${p.id}" data-name="${p.name}">Delete</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`Delete "${btn.dataset.name}"? This cannot be undone.`)) return;
        await supabase.from('products').delete().eq('id', btn.dataset.id);
        loadProducts();
      });
    });
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const grade = document.getElementById('filter-grade').value;
    const stock = document.getElementById('filter-stock').value;
    filterAndRender(q, grade, stock);
  });

  document.getElementById('filter-grade').addEventListener('change', () => {
    const q = document.getElementById('search-input').value.toLowerCase();
    const grade = document.getElementById('filter-grade').value;
    const stock = document.getElementById('filter-stock').value;
    filterAndRender(q, grade, stock);
  });

  document.getElementById('filter-stock').addEventListener('change', () => {
    const q = document.getElementById('search-input').value.toLowerCase();
    const grade = document.getElementById('filter-grade').value;
    const stock = document.getElementById('filter-stock').value;
    filterAndRender(q, grade, stock);
  });

  function filterAndRender(q, grade, stock) {
    let filtered = allProducts;
    if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
    if (grade) filtered = filtered.filter(p => p.grade === grade);
    if (stock === 'in') filtered = filtered.filter(p => p.stock > 10);
    if (stock === 'low') filtered = filtered.filter(p => p.stock > 0 && p.stock <= 10);
    if (stock === 'out') filtered = filtered.filter(p => p.stock === 0);
    renderProducts(filtered);
  }

  loadProducts();
</script>
</body>
</html>
